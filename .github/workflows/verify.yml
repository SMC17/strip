name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  zig-and-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Check formatting
        run: zig fmt --check build.zig src apps tools
      - name: Install JSBSim Python runner
        run: python -m pip install --disable-pip-version-check jsbsim==1.3.1
      - name: Run unit and integration gates
        env:
          JSBSIM_CMD: tools/jsbsim_cmd.sh
          STRIP_JSBSIM_SHIM: ${{ github.workspace }}/zig-out/bin/strip-jsbsim-shim
        run: zig build verify
      - name: Record replay baseline (x86_64 linux Debug)
        run: ./zig-out/bin/strip-record-replay-baseline > replay-baseline-x86_64-linux-Debug.json
      - name: Upload replay baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: replay-baseline-x86_64-linux-Debug
          path: replay-baseline-x86_64-linux-Debug.json
      - name: Validate strict schema fixtures
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import ValidationError
          from jsonschema.validators import validator_for

          for schema_path in sorted(Path("schemas").glob("*.schema.json")):
              schema = json.loads(schema_path.read_text())
              validator_type = validator_for(schema)
              validator_type.check_schema(schema)
              validator = validator_type(schema)
              valid = Path("fixtures/schemas") / schema_path.name.replace(".schema.json", ".valid.json")
              invalid = Path("fixtures/schemas") / schema_path.name.replace(".schema.json", ".invalid.json")
              validator.validate(json.loads(valid.read_text()))
              try:
                  validator.validate(json.loads(invalid.read_text()))
              except ValidationError:
                  pass
              else:
                  raise AssertionError(f"{invalid} unexpectedly passed")
              assert schema.get("additionalProperties") is False
          PY

  replay-baseline-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            arch_label: aarch64-linux
          - os: macos-latest
            arch_label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install JSBSim Python runner
        run: python3 -m pip install --disable-pip-version-check jsbsim==1.3.1
      - name: Build and run proof gates (ReleaseSafe)
        env:
          JSBSIM_CMD: tools/jsbsim_cmd.sh
          STRIP_JSBSIM_SHIM: ${{ github.workspace }}/zig-out/bin/strip-jsbsim-shim
        run: |
          zig build -Doptimize=ReleaseSafe
          ./zig-out/bin/strip-proof-gates
      - name: Record replay baseline for ${{ matrix.arch_label }}
        run: ./zig-out/bin/strip-record-replay-baseline > replay-baseline-${{ matrix.arch_label }}-ReleaseSafe.json
      - name: Upload replay baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: replay-baseline-${{ matrix.arch_label }}-ReleaseSafe
          path: replay-baseline-${{ matrix.arch_label }}-ReleaseSafe.json
