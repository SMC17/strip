name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  zig-and-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Check formatting
        run: zig fmt --check build.zig src apps tools
      - name: Install JSBSim Python runner
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check jsbsim==1.3.1
      - name: Run unit and integration gates
        env:
          JSBSIM_CMD: tools/jsbsim_cmd.sh
          STRIP_JSBSIM_SHIM: ${{ github.workspace }}/zig-out/bin/strip-jsbsim-shim
        run: |
          export PATH="${{ github.workspace }}/.venv/bin:${PATH}"
          zig build verify
      - name: Install replay baseline recorder
        run: zig build
      - name: Record replay baseline (x86_64 linux Debug)
        run: ./zig-out/bin/strip-record-replay-baseline > replay-baseline-x86_64-linux-Debug.json
      - name: Upload replay baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: replay-baseline-x86_64-linux-Debug
          path: replay-baseline-x86_64-linux-Debug.json
      - name: Validate strict schema fixtures
        run: |
          export PATH="${{ github.workspace }}/.venv/bin:${PATH}"
          pip install --disable-pip-version-check 'jsonschema==4.23.0'
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import ValidationError
          from jsonschema.validators import validator_for

          for schema_path in sorted(Path("schemas").glob("*.schema.json")):
              schema = json.loads(schema_path.read_text())
              validator_type = validator_for(schema)
              validator_type.check_schema(schema)
              validator = validator_type(schema)
              valid = Path("fixtures/schemas") / schema_path.name.replace(".schema.json", ".valid.json")
              invalid = Path("fixtures/schemas") / schema_path.name.replace(".schema.json", ".invalid.json")
              validator.validate(json.loads(valid.read_text()))
              try:
                  validator.validate(json.loads(invalid.read_text()))
              except ValidationError:
                  pass
              else:
                  raise AssertionError(f"{invalid} unexpectedly passed")
              assert schema.get("additionalProperties") is False
          PY

  replay-baseline-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            arch_label: aarch64-linux
            rosetta: false
          - os: macos-latest
            arch_label: aarch64-macos
            rosetta: false
          - os: macos-latest
            arch_label: x86_64-macos
            rosetta: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install JSBSim Python runner
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check jsbsim==1.3.1
      - name: Build and run verification gates (ReleaseSafe)
        env:
          JSBSIM_CMD: tools/jsbsim_cmd.sh
          STRIP_JSBSIM_SHIM: ${{ github.workspace }}/zig-out/bin/strip-jsbsim-shim
          STRIP_ALLOW_PENDING_REPLAY: "1"
        run: |
          export PATH="${{ github.workspace }}/.venv/bin:${PATH}"
          if [[ "${{ matrix.rosetta }}" == "true" ]]; then
            zig build -Dtarget=x86_64-macos -Doptimize=ReleaseSafe
          else
            zig build -Doptimize=ReleaseSafe
          fi
          ./zig-out/bin/strip-verification-gates
      - name: Record replay baseline for ${{ matrix.arch_label }}
        run: |
          if [[ "${{ matrix.rosetta }}" == "true" ]]; then
            arch -x86_64 ./zig-out/bin/strip-record-replay-baseline > replay-baseline-${{ matrix.arch_label }}-ReleaseSafe.json
          else
            ./zig-out/bin/strip-record-replay-baseline > replay-baseline-${{ matrix.arch_label }}-ReleaseSafe.json
          fi
      - name: Upload replay baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: replay-baseline-${{ matrix.arch_label }}-ReleaseSafe
          path: replay-baseline-${{ matrix.arch_label }}-ReleaseSafe.json

  replay-baseline-collect:
    needs: replay-baseline-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Download replay baseline artifacts
        uses: actions/download-artifact@v4
        with:
          path: replay-artifacts
          pattern: replay-baseline-*
          merge-multiple: true
      - name: Merge baselines into cross-target manifest
        run: |
          zig build
          cp fixtures/validation/replay/rk4-cross-target.json /tmp/rk4-cross-target.json
          for baseline in replay-artifacts/replay-baseline-*.json; do
            cat "${baseline}" | ./zig-out/bin/strip-promote-replay-baseline > /tmp/rk4-promoted.json
            cp /tmp/rk4-promoted.json /tmp/rk4-cross-target.json
            cp /tmp/rk4-promoted.json fixtures/validation/replay/rk4-cross-target.json
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("fixtures/validation/replay/rk4-cross-target.json").read_text())
          pending = [c["id"] for c in manifest["cases"] if c.get("status") == "pending"]
          if pending:
              raise SystemExit(f"pending cases remain: {pending}")
          print("all replay cases pinned")
          PY
      - name: Upload promoted replay manifest
        uses: actions/upload-artifact@v4
        with:
          name: rk4-cross-target-promoted
          path: fixtures/validation/replay/rk4-cross-target.json

  openvsp-real-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install OpenVSP Ubuntu package
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils xvfb libgl1 libglx-mesa0
          curl -fsSL -o openvsp.deb "https://openvsp.org/download.php?file=zips/old/linux/OpenVSP-3.42.0-Ubuntu-24.04_amd64.deb"
          sudo dpkg -i openvsp.deb || sudo apt-get install -f -y
          VSP_BIN="$(command -v vsp || true)"
          if [[ -z "${VSP_BIN}" && -x /usr/local/bin/vsp ]]; then VSP_BIN=/usr/local/bin/vsp; fi
          if [[ -z "${VSP_BIN}" ]]; then ls -la /usr/local/bin || true; ls -la /opt || true; exit 1; fi
          echo "OPENSP_CMD=${VSP_BIN}" >> "${GITHUB_ENV}"
          echo "OPENSP_RUNTIME_VERSION=3.42.0" >> "${GITHUB_ENV}"
      - name: Install JSBSim Python runner
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check jsbsim==1.3.1
      - name: Build and run verification gates with real OpenVSP
        env:
          JSBSIM_CMD: tools/jsbsim_cmd.sh
          STRIP_JSBSIM_SHIM: ${{ github.workspace }}/zig-out/bin/strip-jsbsim-shim
          OPENSP_CMD: ${{ env.OPENSP_CMD }}
          STRIP_REQUIRE_OPENSP_CMD: "1"
        run: |
          export PATH="${{ github.workspace }}/.venv/bin:${PATH}"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 3
          echo '{"schema":"strip.openvsp-export-protocol.v0","output_path":"openvsp-smoke.stl"}' | python3 tools/openvsp_export.py export | tee export-smoke.json
          python3 -c "import json; r=json.load(open('export-smoke.json')); assert r['backend']=='openvsp_cmd', r"
          zig build -Doptimize=ReleaseSafe
          ./zig-out/bin/strip-verification-gates | tee verification-gates.json
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          smoke = json.loads(Path("export-smoke.json").read_text())
          pin = json.loads(Path("fixtures/validation/openvsp/export-conformance.json").read_text())
          expected = pin.get("openvsp_cmd_mesh_digest")
          if not expected:
              raise SystemExit("openvsp_cmd_mesh_digest pin missing from export-conformance.json")
          if smoke.get("mesh_digest") != expected:
              raise SystemExit(f"export mesh_digest {smoke.get('mesh_digest')} != pin {expected}")
          report = json.loads(open("verification-gates.json").read())
          ov = report.get("openvsp", {})
          if ov.get("export_backend") != "openvsp_cmd":
              raise SystemExit(f"expected openvsp_cmd backend, got {ov.get('export_backend')}")
          if not ov.get("export_real_passed"):
              raise SystemExit("export_real_passed is false")
          conf = ov.get("export_geometry_conformance")
          if conf not in ("landmark_match", "openvsp_cmd_digest_match", "analytic_digest_match"):
              raise SystemExit(f"export_real_passed requires landmark/digest conformance, got {conf}")
          if ov.get("export_mesh_digest") != expected and conf != "landmark_match":
              raise SystemExit(
                  f"gate mesh digest {ov.get('export_mesh_digest')} != pin {expected} (conf={conf})"
              )
          print("real OpenVSP export digest pin matched")
          PY
      - name: Upload OpenVSP export smoke
        uses: actions/upload-artifact@v4
        with:
          name: openvsp-export-smoke
          path: |
            export-smoke.json
            openvsp-smoke.stl

  campaign-10k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Run full 10k campaign bundle
        env:
          STRIP_CAMPAIGN_RUN_ALL: "1"
        run: |
          zig build
          ./zig-out/bin/strip-campaign run campaigns/reference-uas-contingency.toml | tee campaign-bundle.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("campaign.evidence/manifest.json").read_text())
          if manifest.get("monte_carlo_runs") != 10000:
              raise SystemExit(f"expected 10000 declared runs, got {manifest.get('monte_carlo_runs')}")
          if manifest.get("runs_executed") != 10000:
              raise SystemExit(f"expected 10000 executed runs, got {manifest.get('runs_executed')}")
          sig = manifest.get("signature") or {}
          if sig.get("algorithm") != "ed25519":
              raise SystemExit(f"expected ed25519 signature, got {sig}")
          ladder = manifest.get("tier_ladder") or {}
          if ladder.get("software_only") != "passed":
              raise SystemExit(f"software_only tier not passed: {ladder}")
          if ladder.get("flight_test") != "missing":
              raise SystemExit(f"flight_test must remain missing without flight evidence: {ladder}")
          if "hardware_in_loop" not in ladder:
              raise SystemExit("tier_ladder missing hardware_in_loop")
          print("campaign 10k bundle + tier ladder ok")
          PY
      - name: Upload campaign evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: campaign-evidence-10k
          path: campaign.evidence/
