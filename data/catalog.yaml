  - id: tud_mh32_wing_all_aoa
    name: "TU Delft OJF wind tunnel data set with a wing at all angles of attack (modified MH32, flaps, 0/50/70% throttle)"
    url: https://doi.org/10.4121/16620226
    licence: CC0
    citation: "Ma, Z., Smeur, E. (2022). Wind tunnel data set with a wing at all angles of attack. 4TU.ResearchData. doi:10.4121/16620226.v3"
    size: 9.1 MB (zip, sha256 f67b17c17d9f418d704383e6ab23e01ad3f17bc1ebd2b166e591887ff14cfa78)
    quantities: [raw 6-axis balance forces/moments, airspeed 6-12 m/s, turntable angle]
    used_for: candidate VLM lift-slope check
    status: catalogued
    reason: >-
      Raw balance data; the coefficients need the authors' MATLAB tare/calibration chain (calithro*.mat).
      The model is one wing *with a winglet* and propeller mounts in an open jet. Only the chord (0.225 m)
      and A = 1 x 0.225 m^2 are stated; there is no planform/winglet geometry in the dataset. A VLM
      comparison would rest on guessed geometry, so it is not used (no fake physics).
